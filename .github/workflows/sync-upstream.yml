name: Sync upstream main

# Opens a cross-repository pull request that brings fallout2-ce/fallout2-ce
# (main) into this fork's main: base = main (this repo), head = the upstream
# branch itself (fallout2-ce:main), exactly like the compare view
# main...fallout2-ce:fallout2-ce:main.
# The head branch is live upstream, so an open PR updates itself as the
# upstream advances. GitHub allows only ONE open PR per head branch; the job
# refreshes the existing PR instead of creating duplicates.

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/fallout2-ce/fallout2-ce.git
          git fetch upstream main

      - name: Count new upstream commits
        run: |
          COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "New upstream commits: $COUNT"
          git log --oneline --reverse HEAD..upstream/main > /tmp/new-commits.txt
          cat /tmp/new-commits.txt
          test "$COUNT" -gt 0 || {
            echo "Up to date, nothing to do"
            exit 0
          }

      - name: Build PR body
        run: |
          {
            echo "Automated sync of \`fallout2-ce/fallout2-ce\` (main) into this fork."
            echo
            echo "The PR updates itself as the upstream branch advances; merge it whenever you are ready."
            echo
            echo "## New upstream commits"
            echo
            sed 's/^/- /' /tmp/new-commits.txt
            echo
            echo "If this PR shows merge conflicts: close it, merge \`fallout2-ce/main\` into \`main\` manually, the next scheduled run opens a fresh PR."
          } > /tmp/pr-body.md

      - name: Refresh existing sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --state open \
            --json number,headRefName,headRepositoryOwner \
            -q '.[] | select(.headRefName == "main" and .headRepositoryOwner.login == "fallout2-ce") | .number' \
            | head -1)
          if [ -n "$PR" ]; then
            echo "Sync PR #$PR already exists, refreshing description"
            gh pr edit "$PR" --body-file /tmp/pr-body.md
            exit 0
          fi

      - name: Open sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "fallout2-ce:main" \
            --title "Sync upstream fallout2-ce main ($(date -u +%F))" \
            --body-file /tmp/pr-body.md
