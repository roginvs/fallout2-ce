name: Sync upstream main

# Brings fallout2-ce/fallout2-ce (main) into this fork's main.
# The workflow mirrors the upstream branch into this repository: the branch
# sync/upstream-main is pushed to point at the exact upstream main commit —
# nothing from this fork is inside it — and a pull request
# sync/upstream-main -> main is opened or refreshed.
# GitHub computes the PR diff from the merge base (the previous sync), so the
# PR shows only the new upstream changes; merging it combines both sides and
# never drops this fork's own work. Conflicts, if any, must be resolved at
# merge time; they fail nothing here — the PR just shows them.
# The PR body groups the new upstream commits by pull request and lists
# direct commits (made without a PR) separately.

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required to push upstream commits that touch .github/workflows/* files
  # (e.g. org CI changes): without it GitHub rejects the mirror push.
  workflows: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/fallout2-ce/fallout2-ce.git
          git fetch upstream main

      - name: List new upstream commits
        id: commits
        run: |
          # --first-parent walks the upstream line only: a merge-commit PR is a
          # single entry here, so its constituent commits are not listed (and
          # not misclassified as direct commits). Squash PRs are single commits
          # anyway.
          git log --format="%H%x09%s" --reverse --first-parent HEAD..upstream/main > /tmp/new-commits.tsv
          COUNT=$(grep -c . /tmp/new-commits.tsv || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $COUNT"
          cat /tmp/new-commits.tsv
          test "$COUNT" -gt 0 || echo "Up to date, nothing to do"

      - name: Classify commits into pull requests and direct commits
        if: steps.commits.outputs.count != '0'
        run: |
          python3 - <<'PY'
          import re

          prs = {}
          direct = []
          for line in open("/tmp/new-commits.tsv"):
              line = line.rstrip("\n")
              if not line:
                  continue
              sha, subject = line.split("\t", 1)
              m = re.search(r"\(#(\d+)\)\s*$", subject)
              if not m:
                  m = re.match(r"^Merge pull request #(\d+)", subject)
              if m:
                  n = m.group(1)
                  title = re.sub(r"\s*\(#\d+\)\s*$", "", subject)
                  title = re.sub(r"^Merge pull request #\d+ from \S+\s*", "", title)
                  if not title:
                      title = subject
                  prs[n] = title
              else:
                  direct.append(f"`{sha[:8]}` {subject}")

          with open("/tmp/prs.txt", "w") as f:
              for n in sorted(prs, key=int):
                  link = f"https://github.com/fallout2-ce/fallout2-ce/pull/{n}"
                  f.write(f"[#{n}]({link}) {prs[n]}\n")
          with open("/tmp/direct-commits.txt", "w") as f:
              for line in direct:
                  f.write(line + "\n")

          print(f"Pull requests: {len(prs)}, direct commits: {len(direct)}")
          PY

      - name: Build PR body
        if: steps.commits.outputs.count != '0'
        env:
          UPSTREAM_SHA: ${{ steps.commits.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          UPSTREAM_SHORT=${UPSTREAM_SHA:0:8}
          COMMIT_COUNT=$(wc -l < /tmp/new-commits.tsv)
          {
            echo "Automated sync of \`fallout2-ce/fallout2-ce\` (main) into this fork."
            echo
            echo "## Verification"
            echo
            echo "The sync branch is an **exact copy** of the organization's main — nothing from this fork is inside it:"
            echo
            echo "- Branch commit [\`fallout2-ce@\`${UPSTREAM_SHORT}](https://github.com/fallout2-ce/fallout2-ce/commit/${UPSTREAM_SHA}) — [\`sync/upstream-main\`](https://github.com/roginvs/fallout2-ce/tree/sync/upstream-main) points at this exact commit."
            echo "- This PR applies exactly the upstream changes listed below (see the Files changed tab). Merging combines both sides: this fork's own work stays; overlapping files, if any, become conflicts to resolve at merge time."
            echo "- Built by [workflow run #${{ github.run_number }}](${RUN_URL})."
            echo
            echo "## Merged upstream pull requests"
            echo
            if [ -s /tmp/prs.txt ]; then
              sed 's/^/- /' /tmp/prs.txt
            else
              echo "_none_"
            fi
            echo
            echo "## Commits without a pull request"
            echo
            if [ -s /tmp/direct-commits.txt ]; then
              sed 's/^/- /' /tmp/direct-commits.txt
            else
              echo "_none_"
            fi
            echo
            echo "<details><summary>All commits ($COMMIT_COUNT)</summary>"
            echo
            sed 's/^/- /' /tmp/new-commits.tsv | cut -f2-
            echo
            echo "</details>"
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - name: Mirror the upstream branch
        id: mirror
        if: steps.commits.outputs.count != '0'
        env:
          UPSTREAM_SHA: ${{ steps.commits.outputs.upstream_sha }}
        run: |
          REMOTE_SHA=""
          if git fetch origin sync/upstream-main 2>/dev/null; then
            REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          fi
          if [ "$REMOTE_SHA" = "$UPSTREAM_SHA" ]; then
            echo "sync/upstream-main already points at $UPSTREAM_SHA, skipping push"
            exit 0
          fi
          git push --force origin "$UPSTREAM_SHA:refs/heads/sync/upstream-main"

      - name: Open or refresh sync PR
        if: steps.commits.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.ref == "sync/upstream-main") | .number' \
            | head -1)
          TITLE="Sync upstream fallout2-ce main ($(date -u +%F))"
          if [ -n "$PR" ]; then
            echo "Sync PR #$PR already exists, refreshing description"
            # REST PATCH: the GITHUB_TOKEN's GraphQL access is flaky for PRs
            # created by the same token via REST.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              -F title="$TITLE" \
              -F body="$(cat /tmp/pr-body.md)" \
              --jq '.html_url'
          else
            # REST instead of `gh pr create`: the GraphQL createPullRequest
            # mutation is not usable by the Actions integration token.
            gh api "repos/$GITHUB_REPOSITORY/pulls" \
              -F title="$TITLE" \
              -F head="sync/upstream-main" \
              -F base="main" \
              -F body="$(cat /tmp/pr-body.md)" \
              --jq '.html_url'
          fi
