name: Sync upstream main

# Brings fallout2-ce/fallout2-ce (main) into this fork's main through a sync
# branch: the workflow merges upstream/main into a dedicated branch
# (sync/upstream-main), pushes it with the default GITHUB_TOKEN, and opens a
# pull request sync/upstream-main -> main.
# While that PR is open, later runs re-merge, skip the push when the resulting
# tree is unchanged, and refresh the PR description with the fresh commit
# lists.
# Merge conflicts fail the run on purpose: resolve manually, do not pick sides.
# The PR body groups the new upstream commits by pull request and lists
# direct commits (made without a PR) separately.

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/fallout2-ce/fallout2-ce.git
          git fetch upstream main

      - name: List new upstream commits
        id: commits
        run: |
          # --first-parent walks the upstream line only: a merge-commit PR is a
          # single entry here, so its constituent commits are not listed (and
          # not misclassified as direct commits). Squash PRs are single commits
          # anyway.
          git log --format="%H%x09%s" --reverse --first-parent HEAD..upstream/main > /tmp/new-commits.tsv
          COUNT=$(grep -c . /tmp/new-commits.tsv || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $COUNT"
          cat /tmp/new-commits.tsv
          test "$COUNT" -gt 0 || echo "Up to date, nothing to do"

      - name: Classify commits into pull requests and direct commits
        if: steps.commits.outputs.count != '0'
        run: |
          python3 - <<'PY'
          import re

          prs = {}
          direct = []
          for line in open("/tmp/new-commits.tsv"):
              line = line.rstrip("\n")
              if not line:
                  continue
              sha, subject = line.split("\t", 1)
              m = re.search(r"\(#(\d+)\)\s*$", subject)
              if not m:
                  m = re.match(r"^Merge pull request #(\d+)", subject)
              if m:
                  n = m.group(1)
                  title = re.sub(r"\s*\(#\d+\)\s*$", "", subject)
                  title = re.sub(r"^Merge pull request #\d+ from \S+\s*", "", title)
                  if not title:
                      title = subject
                  prs[n] = title
              else:
                  direct.append(f"`{sha[:8]}` {subject}")

          with open("/tmp/prs.txt", "w") as f:
              for n in sorted(prs, key=int):
                  link = f"https://github.com/fallout2-ce/fallout2-ce/pull/{n}"
                  f.write(f"[#{n}]({link}) {prs[n]}\n")
          with open("/tmp/direct-commits.txt", "w") as f:
              for line in direct:
                  f.write(line + "\n")

          print(f"Pull requests: {len(prs)}, direct commits: {len(direct)}")
          PY

      - name: Build PR body
        if: steps.commits.outputs.count != '0'
        run: |
          COMMIT_COUNT=$(wc -l < /tmp/new-commits.tsv)
          {
            echo "Automated sync of \`fallout2-ce/fallout2-ce\` (main) into this fork."
            echo
            echo "## Merged upstream pull requests"
            echo
            if [ -s /tmp/prs.txt ]; then
              sed 's/^/- /' /tmp/prs.txt
            else
              echo "_none_"
            fi
            echo
            echo "## Commits without a pull request"
            echo
            if [ -s /tmp/direct-commits.txt ]; then
              sed 's/^/- /' /tmp/direct-commits.txt
            else
              echo "_none_"
            fi
            echo
            echo "<details><summary>All commits ($COMMIT_COUNT)</summary>"
            echo
            sed 's/^/- /' /tmp/new-commits.tsv | cut -f2-
            echo
            echo "</details>"
            echo
            echo "If this PR shows merge conflicts: close it, merge \`fallout2-ce/main\` into \`main\` manually, the next scheduled run opens a fresh PR."
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - name: Merge upstream into sync branch
        if: steps.commits.outputs.count != '0'
        run: |
          git checkout -B sync/upstream-main
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Merge conflict while syncing upstream/main into main. Resolve manually on branch sync/upstream-main."
            exit 1
          fi

      - name: Push sync branch when changed
        if: steps.commits.outputs.count != '0'
        run: |
          # Skip the push when the resulting tree equals the already pushed
          # branch: re-merging produces a new merge commit with a fresh
          # timestamp even when nothing changed, and pushing it would reset
          # review state on the open PR for no content change.
          if git fetch origin sync/upstream-main 2>/dev/null; then
            if git diff --quiet FETCH_HEAD..HEAD; then
              echo "sync/upstream-main is already up to date, skipping push"
              exit 0
            fi
          fi
          git push --force origin HEAD:refs/heads/sync/upstream-main

      - name: Open or refresh sync PR
        if: steps.commits.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --state open --limit 500 --base main \
            --json number,baseRefName,headRefName \
            -q '.[] | select(.baseRefName == "main" and .headRefName == "sync/upstream-main") | .number' \
            | head -1)
          TITLE="Sync upstream fallout2-ce main ($(date -u +%F))"
          if [ -n "$PR" ]; then
            echo "Sync PR #$PR already exists, refreshing description"
            gh pr edit "$PR" --title "$TITLE" --body-file /tmp/pr-body.md
          else
            # REST instead of `gh pr create`: the GraphQL createPullRequest
            # mutation is not usable by the Actions integration token.
            gh api "repos/$GITHUB_REPOSITORY/pulls" \
              -F title="$TITLE" \
              -F head="sync/upstream-main" \
              -F base="main" \
              -F body="$(cat /tmp/pr-body.md)" \
              --jq '.html_url'
          fi
